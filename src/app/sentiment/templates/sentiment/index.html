<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Review Sentiment</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, sans-serif;
                max-width: 32rem;
                margin: 4rem auto;
                padding: 0 1rem;
                color: #111;
            }
            h1 {
                font-size: 1.25rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
            }
            textarea {
                width: 100%;
                min-height: 8rem;
                padding: 0.75rem;
                border: 1px solid #ccc;
                border-radius: 4px;
                font: inherit;
                resize: vertical;
            }
            button {
                margin-top: 0.75rem;
                padding: 0.5rem 1rem;
                border: none;
                border-radius: 4px;
                background: #111;
                color: #fff;
                font: inherit;
                cursor: pointer;
            }
            button:hover {
                background: #333;
            }
            .result {
                margin-top: 1.5rem;
                padding: 0.75rem 1rem;
                border-radius: 4px;
                background: #f5f5f5;
            }
        </style>
    </head>
    <body>
        <h1>Review Sentiment</h1>
        <form method="post">
            {% csrf_token %}
            <textarea name="review" placeholder="Enter a review..." required>
{{ review }}</textarea
            >
            <button type="submit">Predict</button>
        </form>
        {% if prediction %}
        <p class="result">Sentiment: <strong>{{ prediction }}</strong></p>
        {% endif %}
    </body>
</html>
